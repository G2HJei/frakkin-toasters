# Every push and pull request builds and tests everything and plays the e2e specs against the built jar; a push to
# master then deploys that same jar to the VPS through ssh, where it runs in Docker beside the VPS's Postgres
# (deploy/deploy.sh).
#
# The deploy reads these secrets (Settings > Secrets and variables > Actions, or the "production" environment's):
#   VPS_HOST, VPS_USER               the VPS and the user it logs in as, who may run docker
#   VPS_SSH_KEY or VPS_PASSWORD      a private key (preferred) or the user's password
#   VPS_KNOWN_HOSTS                  the output of ssh-keyscan -p <port> <host>; without it the deploy trusts the key the
#                                    host shows, and sends a password to whoever answers
#   VPS_PORT                         optional, 22 by default
#   DATABASE_URL                     the VPS's Postgres as the container on the host's network sees it,
#                                    e.g. jdbc:postgresql://localhost:5432/frakkin_toasters
#   DATABASE_USER, DATABASE_PASSWORD a role that owns that database: Flyway creates the tables at startup
#   TOKEN_SECRET                     a long random string, e.g. openssl rand -hex 32
#   FRAKKIN_LOGIN_GOOGLE_CLIENTID, FRAKKIN_LOGIN_GOOGLE_CLIENTSECRET     optional, the Google login
#   FRAKKIN_LOGIN_DISCORD_CLIENTID, FRAKKIN_LOGIN_DISCORD_CLIENTSECRET   optional, the Discord login
# and these variables:
#   APP_PORT                         optional, the port the app listens on at the VPS, 8080 by default
#   SPRING_PROFILES_ACTIVE           optional; "dev" adds the login by name, which lets anyone in as anyone
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The backend's tests start their Postgres with Testcontainers, on the runner's Docker.
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: backend/build/libs/backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          if-no-files-found: ignore

  e2e:
    needs: build
    runs-on: ubuntu-latest
    # playthrough.spec.ts gives a whole game up to 30 minutes
    timeout-minutes: 50
    services:
      # The dev profile's database (application.yaml).
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: frakkin_toasters
          POSTGRES_USER: frakkin_toasters
          POSTGRES_PASSWORD: frakkin_toasters
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: backend/build/libs
      # It starts while the browser installs.
      - name: Start the app
        run: nohup java -jar backend/build/libs/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev > app.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0 # frontend/build.gradle's
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for the app
        run: |
          timeout 180 bash -c 'until curl --fail --silent --output /dev/null http://localhost:8080/api/login/providers; do sleep 2; done' \
            || { cat app.log; exit 1; }
      - working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            app.log
            frontend/test-results/
          if-no-files-found: ignore

  deploy:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_PORT: ${{ vars.APP_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: backend/build/libs
      - name: Check the settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER DATABASE_URL DATABASE_USER DATABASE_PASSWORD TOKEN_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name isn't set"; missing=1; fi
          done
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "::error::Neither VPS_SSH_KEY nor VPS_PASSWORD is set"; missing=1
          fi
          exit $missing
      # Writes the vps command, which the later steps run the VPS's commands with.
      - name: Connect to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh ~/bin && chmod 700 ~/.ssh
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS isn't set, so the deploy trusts the host key the VPS shows"
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            Port ${VPS_PORT:-22}
            User $VPS_USER
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
            printf '  IdentityFile ~/.ssh/vps_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config
            printf '#!/bin/sh\nexec ssh vps "$@"\n' > ~/bin/vps
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
            printf '  PreferredAuthentications password,keyboard-interactive\n' >> ~/.ssh/config
            printf '%s' "$VPS_PASSWORD" > ~/.ssh/vps_password && chmod 600 ~/.ssh/vps_password
            # shellcheck disable=SC2016 # $HOME expands when vps runs
            printf '#!/bin/sh\nexec sshpass -f "$HOME/.ssh/vps_password" ssh vps "$@"\n' > ~/bin/vps
          fi
          chmod +x ~/bin/vps
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/vps 'docker version --format "Docker {{.Server.Version}}"'
      - name: Write the app's settings
        env:
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          FRAKKIN_LOGIN_GOOGLE_CLIENTID: ${{ secrets.FRAKKIN_LOGIN_GOOGLE_CLIENTID }}
          FRAKKIN_LOGIN_GOOGLE_CLIENTSECRET: ${{ secrets.FRAKKIN_LOGIN_GOOGLE_CLIENTSECRET }}
          FRAKKIN_LOGIN_DISCORD_CLIENTID: ${{ secrets.FRAKKIN_LOGIN_DISCORD_CLIENTID }}
          FRAKKIN_LOGIN_DISCORD_CLIENTSECRET: ${{ secrets.FRAKKIN_LOGIN_DISCORD_CLIENTSECRET }}
        run: |
          {
            echo "SERVER_PORT=$APP_PORT"
            for name in SPRING_PROFILES_ACTIVE DATABASE_URL DATABASE_USER DATABASE_PASSWORD TOKEN_SECRET \
                FRAKKIN_LOGIN_GOOGLE_CLIENTID FRAKKIN_LOGIN_GOOGLE_CLIENTSECRET \
                FRAKKIN_LOGIN_DISCORD_CLIENTID FRAKKIN_LOGIN_DISCORD_CLIENTSECRET; do
              if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}"; fi
            done
          } | vps 'mkdir -p ~/frakkin-toasters && umask 077 && cat > ~/frakkin-toasters/app.env.next'
      - name: Upload the jar
        run: |
          tar -czf - Dockerfile .dockerignore backend/build/libs/backend-0.0.1-SNAPSHOT.jar \
            | vps 'rm -rf ~/frakkin-toasters/context && mkdir -p ~/frakkin-toasters/context && tar -xzf - -C ~/frakkin-toasters/context'
      - name: Deploy
        run: vps "bash -s -- ${GITHUB_SHA::12} $APP_PORT" < deploy/deploy.sh
