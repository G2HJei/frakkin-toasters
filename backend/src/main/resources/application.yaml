spring:
  application:
    name: frakkin-toasters
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/frakkin_toasters}
    username: ${DATABASE_USER:frakkin_toasters}
    password: ${DATABASE_PASSWORD:frakkin_toasters}
  session:
    jdbc:
      # Flyway's V3 creates the tables.
      initialize-schema: never
  web:
    error:
      # The reasons of a refused lobby or sandbox call are for the user, e.g. "The game is full".
      include-message: always
    resources:
      # StaticResources maps the frontend, with its caching.
      add-mappings: false
  threads:
    virtual:
      enabled: true

frakkin:
  # Hashes the sequence of a game into the token a client echoes. Set it in production.
  token-secret: ${TOKEN_SECRET:local-development-token-secret}
  # The engine answers a decision that has a single legal answer itself, and the log marks it.
  take-only-answers: true

