spring:
  application:
    name: frakkin-toasters
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/frakkin_toasters}
    username: ${DATABASE_USER:frakkin_toasters}
    password: ${DATABASE_PASSWORD:frakkin_toasters}
  session:
    timeout: 30d
    jdbc:
      # Flyway's V3 creates the tables.
      initialize-schema: never
  web:
    error:
      # The reasons of a refused lobby or sandbox call are for the user, e.g. "The game is full".
      include-message: always
    resources:
      # StaticResources maps the frontend, with its caching.
      add-mappings: false
  threads:
    virtual:
      enabled: true
  # The login codes go by SMTP once spring.mail.host is set (with port, username, password and frakkin.mail-from).
  mail:
    properties:
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      # a mail server that doesn't answer fails the request rather than holding it
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  # Behind a proxy that terminates HTTPS (nginx on the VPS), the OAuth callback URLs and the game socket's same-origin
  # check need the scheme the browser used. Tomcat takes X-Forwarded-* only from internal addresses, like the proxy's.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        max-age: 30d

frakkin:
  # Hashes the sequence of a game into the token a client echoes. Set it in production.
  token-secret: ${TOKEN_SECRET:local-development-token-secret}
  # The engine answers a decision that has a single legal answer itself, and the log marks it.
  take-only-answers: true

