# Postgres for local runs, on port 5433 because a native Postgres often holds 5432.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: frakkin_toasters
      POSTGRES_USER: frakkin_toasters
      POSTGRES_PASSWORD: frakkin_toasters
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
