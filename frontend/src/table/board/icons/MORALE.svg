<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- a phoenix rising: its wings raised as fanned feathers of flame, a flame for a head, the body tapering to a forked
       tail; the wings are cut free of the body -->
  <defs>
    <path id="feather" d="M0 0C-3.2-6-4-14-1.2-23 1.2-14 2.2-6 0 0Z"/>
    <g id="bird">
      <path d="M24 5C26.8 9.5 27.8 13 27.2 15.6 26.8 17.6 25.5 18.8 24 18.8S21.2 17.6 20.8 15.6C20.2 13 21.2 9.5 24 5Z"/>
      <path d="M24 20.5C21 21.8 19.2 24.5 19.2 27.8 19.2 32 21.3 36 22.2 40L19.8 46.5 24 43.2 28.2 46.5 25.8 40C26.7 36 28.8 32 28.8 27.8 28.8 24.5 27 21.8 24 20.5Z"/>
    </g>
    <g id="wing">
      <use href="#feather" transform="translate(19 30) rotate(-12)"/>
      <use href="#feather" transform="translate(19 31) rotate(-32) scale(.95)"/>
      <use href="#feather" transform="translate(19.5 32) rotate(-52) scale(.85)"/>
      <use href="#feather" transform="translate(20 33) rotate(-72) scale(.7)"/>
    </g>
  </defs>
  <mask id="free">
    <rect width="48" height="48" fill="#fff"/>
    <use href="#bird" fill="#000" stroke="#000" stroke-width="3.4"/>
  </mask>
  <g fill="#cfe0f0">
    <g mask="url(#free)">
      <use href="#wing"/>
      <use href="#wing" transform="translate(48 0) scale(-1 1)"/>
    </g>
    <use href="#bird"/>
  </g>
</svg>
